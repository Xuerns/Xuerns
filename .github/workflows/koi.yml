name: Generate Git Koi

on:
  schedule:
    - cron: "0 17 * * *" # Daily at 17:00 UTC (00:00 WIB)
  workflow_dispatch:

jobs:
  koi:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Draw Git Koi
        uses: yalongwastaken/git-koi@main
        with:
          login: ${{ github.repository_owner }}
          body: white
          output-dir: koi
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add koi/
          git diff --staged --quiet || (git commit -m "chore: update git-koi activity" && git push)
